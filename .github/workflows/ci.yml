name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        # The full `docling` package pulls in PyTorch and OCR models, which the unit
        # tests never use (parsing is only called at ingest time). `docling-core`
        # provides the document model the figure-extraction tests build on.
        run: |
          grep -v '^docling' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt docling-core -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Pytest
        # Unit tests only: OpenAI, Qdrant and Postgres are faked and outbound network is blocked.
        run: python -m pytest -q

  frontend:
    name: Frontend (oxlint + tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
