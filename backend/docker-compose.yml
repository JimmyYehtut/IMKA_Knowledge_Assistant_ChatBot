name: imka

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: imka-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - imka-qdrant-data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    container_name: imka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: imka
    ports:
      - "5433:5432"
    volumes:
      - imka-postgres-data:/var/lib/postgresql/data

volumes:
  imka-qdrant-data:
    name: imka-qdrant-data
  imka-postgres-data:
    name: imka-postgres-data
